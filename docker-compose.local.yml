name: home-automation-hub-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: hah-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: home_automation_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d home_automation_hub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hah-network

  backend:
    image: node:22-alpine
    container_name: hah-backend-local
    working_dir: /workspace/backend
    command: sh -c "npm install && npm run start:dev"
    restart: unless-stopped
    environment:
      PORT: 3001
      DATA_SOURCE: ${DATA_SOURCE:-in-memory}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/home_automation_hub}
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/workspace/backend
      - backend_node_modules:/workspace/backend/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hah-network

  frontend:
    image: node:22-alpine
    container_name: hah-frontend-local
    working_dir: /workspace/frontend
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/workspace/frontend
      - frontend_node_modules:/workspace/frontend/node_modules
    depends_on:
      - backend
    networks:
      - hah-network

volumes:
  postgres_data_local:
  backend_node_modules:
  frontend_node_modules:

networks:
  hah-network:
    driver: bridge
