# Builds linux/amd64 images and pushes them to GHCR.
#
# Why CI instead of local builds: cross-building the Next.js frontend
# under QEMU on ARM Macs segfaults deterministically (`next build`
# crashes the emulator), while the VPS is x86_64. GitHub runners are
# native amd64, so this is also the repeatable release path.
#
# Manual only on purpose: releases to the borrowed VPS are deliberate.
# Run from the branch you want to release:
#   gh workflow run publish-images.yml --ref <branch>
# Then point docker-compose.portainer.yml at the pushed tags.

name: publish-images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: ./backend
            dockerfile: ./backend/Dockerfile
            image: home-automation-hub-backend
          - context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image: home-automation-hub-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
