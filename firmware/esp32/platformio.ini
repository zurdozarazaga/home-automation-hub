; Home Automation Hub - ESP32-S3 firmware (PlatformIO + Arduino + pioarduino fork).
; See firmware/README.md and docs/aprendizaje/02-integrando-el-esp32.md.
;
; The official espressif32 platform is stuck on Arduino Core 2.x, so this
; project builds on the pioarduino community fork (Arduino Core 3.x over
; IDF 5.x). The platform is pinned to a release zip for reproducible builds;
; CI runs `pio run` on every change under firmware/.

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
; -DSENSOR_FAKE=1  ; append under build_flags to serve fixed fake readings
;                   without a wired sensor (validates the JSON shape only).
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_ldf_mode = chain
lib_compat_mode = strict
lib_deps =
  bblanchon/ArduinoJson@^7.0.0
  ayushsharma82/ElegantOTA@^3.1.7
  knolleary/PubSubClient@^2.8.0
  adafruit/DHT sensor library@^1.4.7
  adafruit/Adafruit Unified Sensor@^1.1.15
