; Home Automation Hub - ESP32-S3 firmware (PlatformIO + Arduino + pioarduino fork).
; See firmware/README.md and docs/aprendizaje/02-integrando-el-esp32.md.
;
; The official espressif32 platform is stuck on Arduino Core 2.x, so this
; project builds on the pioarduino community fork (Arduino Core 3.x over
; IDF 5.x). The platform is pinned to a release zip for reproducible builds;
; CI runs `pio run` on every change under firmware/ (no -e = every env here,
; so both branches of every #if get compiled).

; Optional build defines (documented in firmware/README.md):
;   -DFW_VERSION=\"x.y.z\"              surfaced in GET /health for OTA checks
;   -DOTA_USER=\"u\" -DOTA_PASS=\"p\"   enables the authenticated OTA portal;
;                                       without them OTA stays disabled
;   -DSENSOR_FAKE=1                     fixed readings (JSON shape checks)
;   -DDEBUG_HANG=1                      adds POST /debug/hang (WDT bench test)
; Credentials must never be committed: set them in a local
; platformio_override.ini (gitignored) instead.

; Flags shared by every env (documented PlatformIO pattern: working envs
; inherit this section automatically, and any env that needs extras appends
; ${env.build_flags} explicitly).
[env]
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DFW_VERSION=\"0.4.0\"

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
lib_ldf_mode = chain
lib_compat_mode = strict
lib_deps =
  bblanchon/ArduinoJson@^7.0.0
  ayushsharma82/ElegantOTA@^3.1.7
  knolleary/PubSubClient@^2.8.0
  adafruit/DHT sensor library@^1.4.7
  adafruit/Adafruit Unified Sensor@^1.1.15

; Bench/CI env: compiles the OTA-auth branch, the DEBUG_HANG hook, and the
; SENSOR_FAKE path, none of which the default env reaches. The credentials
; are throwaway values, never real ones.
[env:esp32-s3-devkitc-1-debug]
extends = env:esp32-s3-devkitc-1
build_flags =
  ${env.build_flags}
  -DOTA_USER=\"ci-user\"
  -DOTA_PASS=\"ci-pass\"
  -DDEBUG_HANG=1
  -DSENSOR_FAKE=1
