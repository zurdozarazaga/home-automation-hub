; One-shot WiFi provisioning: writes ssid/pass into the NVS namespace "wifi".
; Usage (pioarduino CLI, Python >= 3.10):
;   cd firmware/tools/wifi-provision
;   WIFI_SSID='your-network' WIFI_PASS='your-password' pio run -t upload
; Credentials travel as build flags fed by the shell environment and are never
; committed. The main firmware reads them at boot (src/net/wifi_nvs.h).
[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
; Same target as the main firmware: ESP32-S3-N16R8 (16 MB QIO flash, 8 MB OPI PSRAM).
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
framework = arduino
monitor_speed = 115200
build_flags =
  -DWIFI_SSID=\"${sysenv.WIFI_SSID}\"
  -DWIFI_PASS=\"${sysenv.WIFI_PASS}\"
