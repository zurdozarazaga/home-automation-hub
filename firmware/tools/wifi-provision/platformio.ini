; One-shot provisioning: writes ssid/pass into the NVS namespace "wifi" and,
; optionally, url/token into "hub" (outbound sync in push mode).
; Usage (pioarduino CLI, Python >= 3.10):
;   cd firmware/tools/wifi-provision
;   WIFI_SSID='your-network' WIFI_PASS='your-password' \
;   HUB_URL='http://hub.example.com:3001' HUB_TOKEN='<service-jwt>' \
;   pio run -t upload
; WIFI_* are required; HUB_* are optional and, when unset or empty, the
; "hub" keys stay untouched (push remains disabled).
; Values travel as build flags fed by the shell environment and are never
; committed. Values with spaces need PlatformIO build-flag escaping; normal
; URLs and JWTs contain no spaces.
[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
; Same target as the main firmware: ESP32-S3-N16R8 (16 MB QIO flash, 8 MB OPI PSRAM).
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
framework = arduino
monitor_speed = 115200
build_flags =
  -DWIFI_SSID=\"${sysenv.WIFI_SSID}\"
  -DWIFI_PASS=\"${sysenv.WIFI_PASS}\"
  -DHUB_URL=\"${sysenv.HUB_URL}\"
  -DHUB_TOKEN=\"${sysenv.HUB_TOKEN}\"
