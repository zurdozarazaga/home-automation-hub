name: home-automation-hub-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: hah-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-home_automation_hub}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-home_automation_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hah-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hah-backend-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATA_SOURCE: prisma
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/home_automation_hub}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hah-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hah-frontend-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - hah-network

volumes:
  postgres_data_prod:

networks:
  hah-network:
    driver: bridge
